<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Helm</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div class="backdrop"></div>
<div class="cursor-dot" id="cursor"></div>

<!-- Avvio: il backend gratuito puo' essere addormentato -->
<div class="boot" id="boot"><div class="row"><span class="dot running pulse"></span><span id="bootTxt">Connessione…</span></div></div>

<!-- Login -->
<section class="login" id="login" hidden>
  <img class="mark fade" src="logo.svg" alt="" draggable="false">
  <h1 class="fade">Helm</h1>
  <p class="lead fade">Il timone dei server. Accesso riservato agli owner.</p>
  <p class="err" id="loginErr"></p>
  <div class="actions fade">
    <button class="btn" id="discordBtn" hidden>
      <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.3.5c1.7.4 3 1 4.3 1.8a13.5 13.5 0 0 0-11.6 0A14 14 0 0 1 12 3.5L11.7 3A19.8 19.8 0 0 0 6.8 4.4 20.4 20.4 0 0 0 3 18.3a19.9 19.9 0 0 0 6 3l.7-1.2c-1-.4-1.9-.9-2.7-1.4l.6-.4a14.2 14.2 0 0 0 12.1 0l.6.4c-.8.5-1.7 1-2.7 1.4l.7 1.2a19.9 19.9 0 0 0 6-3 20.3 20.3 0 0 0-3.8-13.9zM9.3 15.4c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm5.4 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>
      Continua con Discord
    </button>
    <button class="btn btn-ghost" id="tgBtn" hidden>
      <svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.6 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.5l-4.8-1.5c-1-.3-1-1 .2-1.5l18.7-7.2c.9-.3 1.6.2 1.4 1z"/></svg>
      Continua con Telegram
    </button>
  </div>
  <div class="tgwait" id="tgWait" hidden>
    <div class="txt"><span class="dot running pulse"></span>Apri il bot e premi Avvia</div>
    <a class="btn btn-sm" id="tgLink" target="_blank" rel="noopener">Apri il bot</a>
  </div>
  <div class="foot">Sessione 12 ore</div>
</section>

<!-- App -->
<div class="app" id="app" hidden>
  <header class="hdr">
    <div class="brand"><img src="logo.svg" alt="" draggable="false">Helm</div>
    <div class="spacer"></div>
    <nav class="nav">
      <button class="online" id="online" title="Aggiorna i player (glist)"><b id="onlineNum">–</b> online</button>
      <a href="helm-shell:vps" class="hide-m" title="Shell SSH sulla VPS (solo dal tuo PC)">Shell VPS</a>
      <a id="pelican" class="hide-m" target="_blank" rel="noopener">Pelican ↗</a>
      <span class="who hide-m" id="who"></span>
      <button id="logout">Esci</button>
    </nav>
  </header>

  <div class="body">
    <aside class="side" id="side"></aside>

    <main class="main" id="main">
      <div class="head">
        <div class="tt">
          <div class="grp"><span class="dot" id="stDot"></span><span id="grp">–</span><span id="stTxt"></span></div>
          <h2 id="title">–</h2>
        </div>
        <div class="acts">
          <a class="btn btn-ghost btn-sm" id="shell" title="Shell root nella cartella del server (solo dal tuo PC)">Shell</a>
          <button class="btn btn-ghost btn-sm" data-power="start">Avvia</button>
          <button class="btn btn-ghost btn-sm" data-power="restart">Riavvia</button>
          <button class="btn btn-ghost btn-sm danger" data-power="stop">Stop</button>
          <button class="btn btn-ghost btn-sm danger" data-power="kill">Kill</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="k">CPU</div><div class="v" id="sCpu">–</div></div>
        <div class="stat"><div class="k">RAM</div><div class="v" id="sMem">–</div></div>
        <div class="stat"><div class="k">Disco</div><div class="v" id="sDisk">–</div></div>
        <div class="stat"><div class="k">Uptime</div><div class="v" id="sUp">–</div></div>
      </div>

      <pre class="console" id="console"></pre>

      <form class="input" id="form" autocomplete="off">
        <label class="field"><span>›</span><input id="cmd" placeholder="Comando console" spellcheck="false"></label>
        <button class="btn" type="submit">Invia</button>
      </form>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
